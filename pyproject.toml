[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-financial-agent"
version = "0.1.0"
description = "A report-grounded financial QA agent with deterministic tools and security evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mahsa Shakeri" }]
dependencies = []

[project.optional-dependencies]
demo = ["streamlit>=1.39,<2"]

[tool.setuptools.packages.find]
where = ["src"]

